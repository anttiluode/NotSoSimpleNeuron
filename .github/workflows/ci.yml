name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python experiments/run_v0.py --seeds 4 --train-steps 120 --out /tmp/not_so_simple_smoke.json
      - run: python experiments/run_frequency_gate.py --out /tmp/not_so_simple_frequency.json
      - run: python experiments/run_v1.py --seeds 4 --out /tmp/not_so_simple_v1_smoke.json
      - run: python experiments/run_operator_gate.py --out /tmp/not_so_simple_operator.json
      - run: python experiments/run_modal_boundary.py --out /tmp/not_so_simple_modal_boundary.json
      - run: python experiments/run_order_gate.py --out /tmp/not_so_simple_order.json
